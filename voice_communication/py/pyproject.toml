[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-blocks-voice-communication"
version = "0.1.0"
description = "Typed service boundaries for the local Pipecat voice runtime"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_communication"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
